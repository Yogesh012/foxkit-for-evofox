name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Check formatting
        run: cargo fmt --manifest-path app/src-tauri/Cargo.toml --check
      - name: Build the audio helper
        run: tools/audio_tap/build.sh
      - name: Run tests
        run: cargo test --locked --manifest-path app/src-tauri/Cargo.toml
