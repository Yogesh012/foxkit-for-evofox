name: Release

# Pushing a tag like v0.2.0 builds Foxkit for Apple silicon and Intel Macs and prepares a
# draft release with the .dmg, plus the signed update and latest.json that installed copies
# check. Nothing is public, and no copy updates, until the draft is published on GitHub.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Build and draft the release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app's version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' app/src-tauri/Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in app/src-tauri/Cargo.toml."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Run tests
        run: cargo test --locked --manifest-path app/src-tauri/Cargo.toml

      - name: Build the app, .dmg and signed update
        working-directory: app/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret isn't set, so the update can't be signed."
            exit 1
          fi
          cargo tauri build --target universal-apple-darwin \
            --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Describe the update for installed copies
        run: |
          version="${GITHUB_REF_NAME#v}"
          bundle=app/src-tauri/target/universal-apple-darwin/release/bundle/macos
          archive="Foxkit_${version}_universal.app.tar.gz"
          cp "$bundle/Foxkit.app.tar.gz" "$archive"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$archive"
          # One universal build serves both kinds of Mac.
          jq -n \
            --arg version "$version" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "$bundle/Foxkit.app.tar.gz.sig")" \
            --arg url "$url" \
            '{version: $version, pub_date: $date, notes: "",
              platforms: {
                "darwin-aarch64": {signature: $signature, url: $url},
                "darwin-x86_64": {signature: $signature, url: $url}}}' > latest.json

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg=$(ls app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          archive="Foxkit_${GITHUB_REF_NAME#v}_universal.app.tar.gz"
          gh release create "$GITHUB_REF_NAME" "$dmg" "$archive" latest.json \
            --draft \
            --verify-tag \
            --title "Foxkit ${GITHUB_REF_NAME#v}" \
            --generate-notes
