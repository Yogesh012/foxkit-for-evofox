<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foxkit</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Foxkit</h1>
      <div class="header-actions">
        <button id="update" type="button" class="primary" hidden></button>
        <button id="check-updates" type="button">Check for updates</button>
        <button id="refresh" type="button">Refresh</button>
      </div>
    </header>
    <main>
      <section aria-labelledby="keyboard-title">
        <h2 id="keyboard-title">Ronin TKL keyboard</h2>
        <div id="keyboard" aria-live="polite"><p class="note">Reading…</p></div>
      </section>
      <section aria-labelledby="mouse-title">
        <h2 id="mouse-title">Banshee 2 mouse</h2>
        <div id="mouse" aria-live="polite"><p class="note">Reading…</p></div>
      </section>
    </main>
  </body>
</html>
